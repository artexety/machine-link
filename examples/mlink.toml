# Project config: mlink.toml at the project's root, committed with it.
# What to deploy. Found by walking up from the working directory, like git finds .git.
#
# An EMPTY mlink.toml is valid: the enclosing repository's own origin remote is then cloned
# to ~/<name> on the machine. Everything below is optional.

[[repos]]                          # omit to deploy the enclosing repo itself
url = "git@github.com:you/research.git"
dest = "~/research"                # path on the machine; ~ is expanded there
branch = ""                        # optional; empty = the default branch
post_clone = ["uv sync"]           # shell commands, run in dest after clone or pull

# Pairs for 'mlink push' (local to remote, minus whatever .gitignore excludes) and
# 'mlink pull' (remote to local). The same pair travels both ways.
[[sync]]
remote = "~/research/runs"         # results come back from here
local = "~/runs"

# [[sync]]                         # and to send a working tree up without committing it
# remote = "~/research"
# local = "."

[provision]                        # run before the repos, in order
commands = [
  "sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rsync tmux htop",
]
script = ""                        # local path; copied over, run with bash, removed
