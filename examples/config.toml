# Machine config: ~/.config/mlink/config.toml, written by 'mlink init'.
# Who you are. The same on every project.

[ssh]
identity_file = "~/.ssh/id_ed25519"   # its .pub is registered at every provider by 'mlink init'
default_user = "ubuntu"               # remote user when a target names none
connect_timeout = 5                   # seconds per connection attempt
reachability_timeout = 900            # total seconds to wait for a fresh machine to accept ssh;
                                      # Vast's base image needs 5-10 minutes on its first boot
forward_agent = "constrained"         # what a rented machine sees of your agent:
                                      #   constrained  your key, usable only for github.com and
                                      #                only from that machine (OpenSSH 8.9+)
                                      #   always       the whole agent, as 'ssh -A' does it
                                      #   never        nothing; private repos will not clone

[git]
name = "Ada Lovelace"
email = "ada@example.com"

# A provider is on when its section exists; 'mlink init' writes the sections for the providers
# whose credentials it finds. Credentials are read from the environment or from
# ~/.config/mlink/.env (chmod 600), never from this file:
#   PRIME_API_KEY                          app.primeintellect.ai > settings > API keys
#   VAST_API_KEY                           cloud.vast.ai > Account > Keys
#   VERDA_CLIENT_ID, VERDA_CLIENT_SECRET   Verda console > Credentials > Cloud API Credentials
# Your ssh key is registered at each of them by 'mlink init'; nothing else is needed.

[providers.prime]
# image = "ubuntu_22_cuda_12"         # default: the first image the offer lists
# disk_gb = 256

[providers.vast]
# image = "vastai/base-image:@vastai-automatic-tag"   # any docker image; Vast adds sshd
# disk_gb = 50                        # instances are reached as root through Vast's ssh proxy

[providers.verda]
image = "ubuntu-24.04-cuda-12.6"      # the plain ubuntu-24.04 image ships without a driver
# location = "FIN-01"                 # used when an offer names no location
# disk_gb = 100

# Machines with a fixed address and no API behind them: a workstation, a lab server. Each gets
# an ssh alias exactly like a rented one, so 'ssh workstation' works from any tool.
[[machines]]
name = "workstation"
host = "192.168.1.50"
user = "alex"
# port = 22
