[project]
name = "machine-link"
dynamic = ["version"]
description = "One command to prepare a rented or local machine for work."
readme = "README.md"
authors = [{ name = "Artexety", email = "x@alexanderlowa.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13.7"]

[project.urls]
Homepage = "https://github.com/artexety/machine-link"
Repository = "https://github.com/artexety/machine-link"
Issues = "https://github.com/artexety/machine-link/issues"

[project.scripts]
mlink = "machine_link.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/machine_link/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/tmp", "/.github"]

[tool.hatch.build.targets.wheel]
packages = ["src/machine_link"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
